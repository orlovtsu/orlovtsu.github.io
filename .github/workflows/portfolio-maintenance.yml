name: Curate portfolio history
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit to replace
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: portfolio-history-maintenance
  cancel-in-progress: false
jobs:
  curate:
    if: github.repository == 'orlovtsu/orlovtsu.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha }}
      - name: Publish reviewed snapshot and remove superseded bundles
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
