bdb1c0c2f193f5bc638e5325cd7a3f0', 'plot6_.html': 'c34d91002a653c8c4a833d49973e1f7448e5f883', 'plot6_1.html': 'e60cdbc6b59e173f94e2f88cfe05268755568731', 'plot7.html': '0525621e17206c8a7740a998c4e9b2167f51b051', 'plot8.html': 'db1c7e89219fb7731cf2345b21d4008b8a67b0ae', 'plot9.html': 'f7e07eaa0b785c21a188c71be771bd632b197b6b', 'schizophrenia.html': '6b39e23a6718d0be997320659ed8d29ca04aeb01', 'top20.html': 'cc81070209770f4352a476b048135627c8d8f12f', 'university_majors.html': 'cb6cb93011fa4baf7a95af43dbe8ba500298bc6f'}
          def git(*args, data=None, env=None):
              return subprocess.check_output(['git', *args], input=data, text=True, env=env).strip()
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', expected), 'Expected a full commit SHA'
          assert os.environ['GITHUB_REPOSITORY'] == REPOSITORY
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert git('rev-parse','HEAD') == expected, 'Checkout differs from requested revision'
          refs = git('ls-remote','--heads','--tags','origin').splitlines()
          assert refs == [expected + '\trefs/heads/main'], 'Unexpected branches, tags, or concurrent update'
          subprocess.run(['git','merge-base','--is-ancestor',BASELINE,expected],check=True)
          for path, sha in EXPECTED_FILES.items():
              assert git('hash-object',path) == sha, 'Reviewed public file changed: ' + path
          for path, sha in RETIRE.items():
              assert git('rev-parse','HEAD:'+path) == sha, 'Retired file changed: ' + path
          discarded=set(git('rev-list',BASELINE+'..'+expected).splitlines())
          assert discarded
          subprocess.run(['git','rm','--quiet','--',*RETIRE],check=True)
          tree=git('write-tree')
          env=os.environ.copy()
          env.update(GIT_AUTHOR_NAME='Sergey Orlov',GIT_AUTHOR_EMAIL='39021396+orlovtsu@users.noreply.github.com',GIT_COMMITTER_NAME='Sergey Orlov',GIT_COMMITTER_EMAIL='39021396+orlovtsu@users.noreply.github.com')
          new_commit=git('commit-tree',tree,'-p',BASELINE,data='Publish curated professional portfolio\n',env=env)
          assert git('rev-parse',new_commit+'^') == BASELINE
          assert not discarded.intersection(git('rev-list',new_commit).splitlines())
          assert git('rev-parse',new_commit+'^{tree}') == tree
          subprocess.run(['git','push','--force-with-lease=refs/heads/main:'+expected,'origin',new_commit+':refs/heads/main'],check=True)
          assert git('ls-remote','--heads','origin','main').split()[0] == new_commit
          print('Published curated snapshot:',new_commit)
          print('Retained earlier history and removed',len(discarded),'intermediate commits from main ancestry.')
          
          # Remove stored Pages bundles built from the superseded intermediate history.
          # Keep workflow run records and logs; this does not purge GitHub object caches.
          token=os.environ['GH_TOKEN']
          def api(path,method='GET'):
              req=urllib.request.Request('https://api.github.com/repos/'+REPOSITORY+'/'+path,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          artifacts=[]
          page=1
          while True:
              batch=api('actions/artifacts?per_page=100&page='+str(page))['artifacts']
              artifacts.extend(batch)
              if len(batch)<100:break
              page+=1
          removed=0
          for item in artifacts:
              if item['name']=='github-pages' and item.get('workflow_run',{}).get('head_sha') in discarded:
                  api('actions/artifacts/'+str(item['id']),'DELETE')
                  removed+=1
          print('Removed superseded Pages bundles:',removed)
          PY
